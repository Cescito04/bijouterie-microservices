# Expose le frontend sur le NodePort 30080.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  type: NodePort
  selector:
    app: bijouterie
    tier: frontend
  ports:
    - port: 80
      targetPort: http
      # Port exposé sur les nœuds du cluster.
      nodePort: 30080
