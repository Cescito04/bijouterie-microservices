# Deux instances de l’API Node.js.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bijouterie
      tier: backend
  template:
    metadata:
      labels:
        app: bijouterie
        tier: backend
    spec:
      containers:
        - name: backend
          image: cescito04/bijouterie-backend:initial-1
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          # valueFrom sélectionne explicitement chaque clé sensible.
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
          # Ressources réservées et limites CPU/mémoire.
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
